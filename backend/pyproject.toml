[project]
name = "delicias-backend"
version = "0.1.0"
description = "Backend da Delícias de Marias"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"